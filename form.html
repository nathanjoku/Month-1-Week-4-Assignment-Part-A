<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial scale=1.0" />
    <title>Registration</title>
  </head>
  <body>
    <nav aria-label="main navigation">
      <a href="./form.html"> Sign up</a>
      <a href="../Month-1-Week-4-Assignment-Part-A/index.html"> ALT School Profile</a>
    </nav>
    <h1>
      Alt___ <br />
      School
      <hr />
    </h1>
    <h2>Sign up</h2>
    <p>Create an account to get started on your learning journey</p>
    <form method="post" action="validate">
      <p>
        <label for="email">Email Address</label> <br />
        <input
          type="email"
          id="email"
          placeholder="janedoe@gmail.com"
          required
        />
      </p>
      <p>
        <label for="firstName">First Name</label> <br />
        <input
          type="text"
          name="firstName"
          id="firstName"
          placeholder="Enter Your First Name"
          required
        />
      </p>
      <p>
        <label for="lastName">Last Name</label> <br />
        <input
          type="text"
          name="lastName"
          id="lastName"
          placeholder="Enter Your Last Name"
          required
        />
      </p>
      <p>
        <label for="phoneNumber">Phone number</label> <br />
        <input
          type="tel"
          name="phoneNumber"
          id="phoneNumber"
          placeholder="0800 123 4567"
          required
        />
      </p>
      <p>
        <label for="password">Password</label> <br />
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Create new password"
          required
        />
        <br /><small>Minimum 8 characters</small>
      </p>
      <p>
        <label for="confirmPassword">Confirm password</label> <br />
        <input
          type="password"
          name="confirmPassword"
          id="confirmPassword"
          placeholder="Re-enter password"
          required
        />
      </p>
    </form>
    <p>
      By clicking Create account, I agree to
      <a href="terms.html">Terms of Use</a> and acknowledge that I have read the
      <a href="privacy.html">Privacy Policy</a>.
    </p>
    <button><a href="../Month-1-Week-4-Assignment-Part-A/index.html"> Create account</a></button>
    <br />
    <small>----------OR-------------</small>
    <br />
    <button>
      <a href="http://google.com/accounts" target="_blank">Login with Google</a>
    </button>
    <hr />
    <a href="#top" title="Return to top of page">Back to top</a>
  </body>
</html>
